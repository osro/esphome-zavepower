name: Validate firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test command delivery
        env:
          CXX: clang++
        run: sh tests/run_native.sh
      - name: Install ESPHome
        run: pip install esphome==2026.9.0
      - name: Compile with local component and test credentials
        run: python tests/check_firmware.py --compile
